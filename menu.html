<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Java Been Coffee Co.</title>
  <link rel="stylesheet" href="css/styles.css">
</head>


<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
		  <img src="img/jb-bw.png" alt=""/> </span>
      </a>

      <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false">
        Menu
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a class="nav-link" href="index.html">Home</a>
<a class="nav-link active" href="menu.html">Menu</a>
<a class="nav-link" href="about.html">About</a>
<a class="nav-link" href="locations.html">Locations</a>
<a class="nav-link" href="contact.html">Contact</a>

      </nav>
    </div>
  </header>

  <main id="main" class="page">
  <section class="section">
    <div class="container">
      <h1>Menu</h1>
      <p class="muted">Add your drinks + food categories here.</p>

      <div class="cards">
        <article class="card">
          <h2>Espresso</h2>
          <p>Americano, Latte, Cappuccino</p>
        </article>
        <article class="card">
          <h2>Cold Drinks</h2>
          <p>Cold Brew, Iced Latte, Nitro</p>
        </article>
        <article class="card">
          <h2>Food</h2>
          <p>Pastries, breakfast sandwiches</p>
        </article>
      </div>
    </div>
  </section>
</main>


  <footer class="site-footer">
    <div class="container footer-row">
      <p>© <span id="year"></span> Java Been Coffee Co.</p>
      <p class="muted">Built for your mock-up → real website project.</p>
    </div>
  </footer>

  <script>
    // tiny baseline JS: year + mobile nav
    document.getElementById("year").textContent = new Date().getFullYear();

    const btn = document.querySelector(".nav-toggle");
    const nav = document.getElementById("site-nav");
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      nav.classList.toggle("open");
    });
  </script>
</body>
</html>
