<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Java Been Coffee Co.</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html" aria-label="Java Been Home">
        <img src="img/jb-bw.png" alt="Java Been Coffee Co.">
      </a>

      <button class="hamburger" type="button"
        aria-controls="site-nav"
        aria-expanded="false"
        aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav id="site-nav" class="nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="locations.html">Locations</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main id="main" class="page">
    <h1 class="page-title">Contact Us</h1>

    <p>
      Have a question, feedback, or just want to say hello?  
      Fill out the form below and we’ll get back to you.
    </p>

    <!-- Contact Form -->
    <form id="contact-form" novalidate>
      <div class="form-group">
        <label for="name">Name<span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" required>
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="email">Email<span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required>
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="message">Message<span aria-hidden="true">*</span></label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <small class="error-message"></small>
      </div>

      <button type="submit" class="home-cta">Send Message</button>

      <p id="form-success" class="is-hidden">
        Thanks! Your message has been sent.
      </p>
    </form>
  </main>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
