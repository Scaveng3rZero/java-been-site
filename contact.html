      <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false">

      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a class="nav-link active" href="file:///C|/Users/irela/Scaveng3r/Brand Assets/Progress/index.html">Home</a>

  <main id="main" class="page">
  <section class="section">
    <div class="container">
      <h1>Contact</h1>
      <p class="muted">This is a baseline form (no backend yet).</p>

      <form class="card" action="#" method="post">
        <label>
          Name<br>
          <input type="text" name="name" required>
        </label>
        <br><br>
        <label>
          Email<br>
          <input type="email" name="email" required>
        </label>
        <br><br>
        <label>
          Message<br>
          <textarea name="message" rows="5" required></textarea>
        </label>
        <br><br>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </section>
</main>


  <footer class="site-footer">

      <p>© <span id="year"></span> Java Been Coffee Co.</p>
      <p class="muted">Built for your mock-up → real website project.</p>
    </div>
  </footer>

  <script>
    // tiny baseline JS: year + mobile nav
    document.getElementById("year").textContent = new Date().getFullYear();

    const btn = document.querySelector(".nav-toggle");
    const nav = document.getElementById("site-nav");
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      nav.classList.toggle("open");
    });
  </script>
